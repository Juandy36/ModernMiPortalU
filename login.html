<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Modern MiPortalU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-unab-cream min-h-screen">
  <main class="max-w-md mx-auto px-4 py-10 sm:py-16">
    <p class="text-small font-bold tracking-widest text-unab-text text-center">MODERN MIPORTALU</p>
    <h1 class="text-h2 text-center mt-1 mb-6">Ingresa a tu portal</h1>

    <div class="card">
      <p id="error" role="alert" class="hidden mb-4 px-3 py-2 rounded-md font-semibold" style="background:#FDECEA;color:#B42318;"></p>

      <div id="olvido" hidden class="mb-4 px-3 py-3 rounded-md" style="background:#FFF3D6;" role="status">
        <p class="font-bold">¿Olvidaste tu contraseña?</p>
        <p class="text-small mt-1">Por seguridad, el restablecimiento lo hace el equipo de Punto U: escribe a
          <a class="font-bold underline" href="mailto:agentedeservicios@unab.edu.co">agentedeservicios@unab.edu.co</a>
          o llama al 607 643 6111 ext. 1751 indicando tu usuario.</p>
      </div>

      <form id="form-login" class="space-y-4" novalidate>
        <div>
          <label class="label" for="l-usuario">Usuario</label>
          <input id="l-usuario" name="usuario" class="field" autocomplete="username" required>
        </div>
        <div>
          <label class="label" for="l-clave">Contraseña</label>
          <input id="l-clave" name="clave" type="password" class="field" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-full">Ingresar</button>
        <button type="button" id="btn-olvido" aria-expanded="false" aria-controls="olvido" class="block mx-auto font-bold text-unab-text underline">¿Olvidaste tu contraseña?</button>
      </form>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
