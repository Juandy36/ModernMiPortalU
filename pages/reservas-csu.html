<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas de espacios CSU · Modern MiPortalU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind-config.js"></script>
  <script src="/js/auth.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../" data-active="reservas">
  <div id="app-navbar"></div>

  <main class="max-w-page mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-6">
    <h1 class="text-h1">Reservas de espacios CSU</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      <section class="card space-y-5">
        <div>
          <label class="label" for="espacio">Espacio</label>
          <select id="espacio" class="field"></select>
        </div>
        <div>
          <div class="flex items-center justify-between mb-3">
            <button id="mes-ant" type="button" class="btn btn-secondary text-h3 leading-none" aria-label="Mes anterior">‹</button>
            <h2 id="mes-titulo" class="text-h3"></h2>
            <button id="mes-sig" type="button" class="btn btn-secondary text-h3 leading-none" aria-label="Mes siguiente">›</button>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center text-small font-bold mb-1" aria-hidden="true">
            <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
          </div>
          <div id="calendario" class="grid grid-cols-7 gap-1" role="grid" aria-label="Días del mes"></div>
        </div>
      </section>

      <section class="card space-y-4">
        <h2 id="franjas-titulo" class="text-h3"></h2>
        <div id="franjas" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
        <p class="text-small">
          <span class="inline-block w-3 h-3 rounded bg-unab align-middle"></span> Elegida ·
          <span class="inline-block w-3 h-3 rounded bg-gray-300 align-middle"></span> Ocupada ·
          <span class="inline-block w-3 h-3 rounded bg-unab-cream border border-unab-dark align-middle"></span> Tu reserva
        </p>
        <p id="resumen" class="font-semibold"></p>
        <button id="confirmar" type="button" class="btn btn-primary" disabled>Confirmar reserva</button>
        <p id="ok-reserva" class="hidden font-semibold text-ok" role="status"></p>
      </section>
    </div>

    <section class="card">
      <h2 class="text-h3 mb-4">Mis reservas</h2>
      <table class="table">
        <thead><tr><th>Espacio</th><th>Fecha</th><th>Hora</th><th></th></tr></thead>
        <tbody id="mis-reservas"></tbody>
      </table>
      <p id="sin-reservas" class="hidden py-4 text-center">Aún no tienes reservas.</p>
    </section>
  </main>

  <div id="app-footer"></div>
  <script src="../js/storage.js"></script>
  <script src="../js/data/reservas.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/reservas-csu.js"></script>
</body>
</html>
