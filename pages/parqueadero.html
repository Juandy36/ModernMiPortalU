<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membresía del parqueadero · Modern MiPortalU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../" data-active="parqueadero">
  <div id="app-navbar"></div>

  <main class="max-w-page mx-auto px-6 py-10 space-y-6">
    <h1 class="text-h1">Membresía del parqueadero</h1>

    <div class="grid grid-cols-2 gap-6 items-start">
      <section class="card space-y-2">
        <h2 class="text-h3">Estado actual</h2>
        <p id="estado-membresia"></p>
        <p id="vencimiento"></p>
        <p id="vehiculo"></p>
      </section>

      <section class="card space-y-4">
        <h2 class="text-h3">Renovar membresía</h2>
        <div>
          <span class="label">Mes a renovar</span>
          <p id="mes-renovar" class="font-semibold"></p>
        </div>
        <div>
          <label class="label" for="tipo">Tipo de vehículo</label>
          <select id="tipo" class="field"></select>
        </div>
        <p id="linea-valor">Valor a pagar: <strong id="valor"></strong> <span class="text-small">(valor de ejemplo)</span></p>
        <button id="pagar" type="button" class="btn btn-primary">Pagar y renovar</button>
        <p class="text-small">Simulación: no se realiza ningún cobro.</p>
        <p id="ok-pago" class="hidden font-semibold text-ok" role="status"></p>
      </section>
    </div>

    <section class="card">
      <h2 class="text-h3 mb-4">Historial de pagos</h2>
      <table class="table">
        <thead><tr><th>Fecha</th><th>Mes</th><th>Valor</th><th>Estado</th><th>Comprobante</th></tr></thead>
        <tbody id="historial"></tbody>
      </table>
    </section>
  </main>

  <!-- Solo visible al imprimir un comprobante -->
  <div id="comprobante" class="hidden p-10"></div>

  <div id="app-footer"></div>
  <script src="../js/storage.js"></script>
  <script src="../js/data/parqueadero.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/parqueadero.js"></script>
</body>
</html>
