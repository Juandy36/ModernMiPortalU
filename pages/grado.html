<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi grado · Modern MiPortalU</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind-config.js"></script>
  <script src="/js/auth.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../" data-active="grado">
  <div id="app-navbar"></div>

  <main class="max-w-page mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-6">
    <div>
      <h1 class="text-h1">Mi grado</h1>
      <p class="mt-2">Todo lo que necesitas cumplir para graduarte, en un solo lugar.</p>
    </div>

    <section class="card" aria-labelledby="global-titulo">
      <h2 id="global-titulo" class="text-h3 mb-3">Progreso general</h2>
      <p id="global-pct" class="text-h1 text-unab-text"></p>
      <div id="global-barra" role="progressbar" aria-label="Progreso general para el grado" aria-valuemin="0" aria-valuemax="100" class="h-4 rounded-full bg-surface overflow-hidden mt-2">
        <div id="global-relleno" class="h-full bg-unab" style="width:0%"></div>
      </div>
      <p class="text-small mt-2">Promedio del avance de los seis requisitos. Datos de ejemplo.</p>
    </section>

    <section aria-labelledby="req-titulo" class="space-y-4">
      <h2 id="req-titulo" class="text-h2">Requisitos</h2>
      <div id="requisitos" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>

    <section class="card" aria-labelledby="cron-titulo">
      <h2 id="cron-titulo" class="text-h3 mb-3">Fechas de grado</h2>
      <ul id="fechas" class="space-y-2"></ul>
      <a href="cronogramas.html" class="btn btn-secondary mt-4">Ver todos los cronogramas</a>
    </section>
  </main>

  <div id="app-footer"></div>
  <script src="../js/storage.js"></script>
  <script src="../js/data/cursos.js"></script>
  <script src="../js/data/horas-libres.js"></script>
  <script src="../js/data/pagos.js"></script>
  <script src="../js/data/cronogramas.js"></script>
  <script src="../js/data/grado.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/grado.js"></script>
</body>
</html>
