<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semilleros de investigación · Modern MiPortalU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../" data-active="semilleros">
  <div id="app-navbar"></div>

  <main class="max-w-page mx-auto px-6 py-10 space-y-6">
    <h1 class="text-h1">Semilleros de investigación</h1>

    <div class="max-w-xs">
      <label class="label" for="facultad">Facultad</label>
      <select id="facultad" class="field"></select>
    </div>

    <div id="lista" class="grid grid-cols-2 gap-6"></div>

    <section class="card">
      <h2 class="text-h3 mb-4">Mis inscripciones</h2>
      <ul id="mis-inscripciones" class="space-y-3"></ul>
      <p id="sin-inscripciones" class="hidden">Aún no estás inscrito en ningún semillero. Cuando te inscribas, aparecerá aquí con su estado.</p>
    </section>
    <p id="aviso" class="sr-only" role="status"></p>
  </main>

  <div id="app-footer"></div>
  <script src="../js/storage.js"></script>
  <script src="../js/data/semilleros.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/semilleros.js"></script>
</body>
</html>
