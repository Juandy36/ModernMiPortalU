<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes · Modern MiPortalU</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind-config.js"></script>
  <script src="/js/auth.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../" data-active="solicitudes">
  <div id="app-navbar"></div>

  <main class="max-w-page mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-6">
    <div>
      <h1 class="text-h1">Solicitudes</h1>
      <p class="mt-2">Crea, consulta y haz seguimiento a tus solicitudes académicas y financieras.</p>
    </div>
    <p id="aviso" class="hidden px-3 py-2 rounded-md font-semibold" role="status"></p>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Mis solicitudes -->
      <section class="card lg:col-span-1 self-start" aria-labelledby="mis-titulo">
        <h2 id="mis-titulo" class="text-h3">Mis solicitudes</h2>
        <h3 class="font-bold mt-4">En trámite <span id="n-tramite" class="badge badge-pending ml-1">0</span></h3>
        <ul id="lista-tramite" class="mt-2 space-y-3"></ul>
        <h3 class="font-bold mt-6">Finalizadas <span id="n-final" class="badge badge-ok ml-1">0</span></h3>
        <ul id="lista-final" class="mt-2 space-y-3"></ul>
      </section>

      <!-- Nueva solicitud -->
      <section class="card lg:col-span-2" aria-labelledby="nueva-titulo">
        <h2 id="nueva-titulo" class="text-h3">Nueva solicitud</h2>
        <p class="text-small mb-4">Selecciona el servicio desde el buscador o navegando por las categorías.</p>
        <label class="label" for="buscar">Buscar servicio</label>
        <input id="buscar" type="search" class="field" placeholder="Nombre del servicio o palabra clave" autocomplete="off">
        <div id="tabs" class="flex flex-wrap gap-2 mt-4" role="tablist" aria-label="Categorías"></div>
        <p id="contador" class="text-small mt-3" role="status"></p>
        <div id="servicios" class="mt-3 space-y-3"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="../js/storage.js"></script>
  <script src="../js/data/solicitudes.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/solicitudes.js"></script>
</body>
</html>
